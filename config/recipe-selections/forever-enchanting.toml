# Which recipes `python -m brownstone recipes` puts in config/forever-enchanting.toml.
# List finished recipes; the intermediates they need are added from the same page.
# Source page: https://www.wowhead.com/forever/spells/professions/enchanting, saved in a browser. Added in the app.
