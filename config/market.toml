# Shared settings; any source may override them. Paths are relative to the project folder.
data_dir = "data"
max_age_hours = 24
auction_cut = 0.05  # Neutral auction houses default to 0.15 unless a source sets its own.
min_discount = 0.20
top_n = 20

# Each [[sources]] entry is one feed (source_id, provider, and a URL or scan file) observing one market.
# The market is the auction house: game_version + region + scope + realm/server_type + faction.
# market_id is derived from those fields, so several sources can observe the same market.
# source_id also names the source's data folder; the IDs below predate the split and match
# their market IDs, which keeps existing data in place.
#
# A Forever market has no realm, for example:
#   game_version = "forever", region = "us", scope = "house",
#   server_type = "roleplaying", faction = "alliance"   # -> forever-us-roleplaying-alliance

[[sources]]
source_id = "classic-us-mankrik-alliance"
provider = "tsm"
label = "Mankrik Alliance — Classic Era (TSM)"
source_url = "https://public-data.tradeskillmaster.com/classic/us/realm/mankrik-alliance/items.csv"
game_version = "classic"
region = "us"
scope = "house"
realm = "mankrik"
faction = "alliance"
rules_version = "classic-era"  # Catalogs with the same game_version and rules_version price this market.
allow_missing_updated_at = true

[[sources]]
source_id = "retail-us-area-52"
provider = "tsm"
label = "Area 52 realm items (TSM, regression only)"
source_url = "https://public-data.tradeskillmaster.com/retail/us/realm/area-52/items.csv"
game_version = "retail"
region = "us"
scope = "house"
realm = "area-52"

[[sources]]
source_id = "retail-us-commodities"
provider = "tsm"
label = "US regional commodities (TSM, regression only)"
source_url = "https://public-data.tradeskillmaster.com/retail/us/commodities.csv"
game_version = "retail"
region = "us"
scope = "region"

# Our own BrownstoneScan addon (provider "addon"): imports a SavedVariables file only when you click
# Import addon scan or run `python -m brownstone --source <id>`. It reads the file and never writes it.
# The market fields define the house; scan_evidence values are checked against every scan, and a
# mismatch fails the import. Beta region and realm are generic, so they are not evidence here.
[[sources]]
source_id = "forever-us-normal-alliance-addon"
provider = "addon"
enabled = false  # Enable it, and set scan_path, in config/market.local.toml (untracked).
label = "Forever US Normal Alliance — my scans (addon)"
# Placeholder. The game's own file contains your account folder name, so keep the real path in
# config/market.local.toml, which Git ignores:
#   [sources.forever-us-normal-alliance-addon]
#   enabled = true
#   scan_path = "/Applications/World of Warcraft/_classic_beta_/WTF/Account/<ACCOUNT>/SavedVariables/BrownstoneScan.lua"
scan_path = "data/inbox/addon-scans/BrownstoneScan.lua"
game_version = "forever"
region = "us"
scope = "house"
server_type = "normal"
faction = "alliance"
rules_version = "forever-beta-1.60"

[sources.scan_evidence]
faction = "Alliance"
zone = "Stormwind City"
auctioneer = "Auctioneer Fitch"
