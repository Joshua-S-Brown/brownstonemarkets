# Verified public development dataset; change URL and market_id together.
data_dir = "data"
max_age_hours = 24
auction_cut = 0.05
min_discount = 0.20
top_n = 20

[[sources]]
label = "Mankrik Alliance — Classic Era"
market_id = "classic-us-mankrik-alliance"
game_version = "classic"
region = "us"
scope = "realm"
realm = "mankrik-alliance"
ruleset = "classic-era"  # Crafting catalogs with the same game_version and ruleset can price against this market.
source_url = "https://public-data.tradeskillmaster.com/classic/us/realm/mankrik-alliance/items.csv"
allow_missing_updated_at = true

[[sources]]
label = "Area 52 realm items"
market_id = "retail-us-area-52"
game_version = "retail"
region = "us"
scope = "realm"
realm = "area-52"
source_url = "https://public-data.tradeskillmaster.com/retail/us/realm/area-52/items.csv"

[[sources]]
label = "US regional commodities"
