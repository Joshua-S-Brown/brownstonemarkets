name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned versions first, then the project without re-resolving, so CI matches local setups.
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m mypy
      # Streamlit is in the lock file, so the UI test runs instead of skipping.
      # Coverage report; fails below the fail_under floor in pyproject.toml.
      - run: python -m pytest -p no:cacheprovider --cov
