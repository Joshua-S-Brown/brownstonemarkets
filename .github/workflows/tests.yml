name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned versions first, then the project without re-resolving, so CI matches local setups.
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m mypy
      # Coverage report; fails below the fail_under floor in pyproject.toml.
      - run: python -m pytest -p no:cacheprovider -n auto --cov -ra

      - uses: actions/setup-node@v4
        if: runner.os == 'macOS'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: runner.os == 'macOS'
        working-directory: web
      - run: npm run check
        if: runner.os == 'macOS'
        working-directory: web
      - run: echo "Web checks skipped on Windows; checked on macOS."
        if: runner.os == 'Windows'
