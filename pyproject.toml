[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brownstone-markets"
version = "0.2.0"
description = "Local WoW market research: price snapshots, addon scans and crafting analysis"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.2,<2", "polars>=1.20,<2", "pyarrow>=19,<26", "requests>=2.32,<3", "tzdata>=2025.1",
                # DuckDB needs pytz to return TIMESTAMPTZ values to Python.
                "pytz>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1", "mypy>=1.10,<2", "lupa==2.6"]
dashboard = ["streamlit>=1.40,<2"]

[project.scripts]
brownstone = "brownstone.cli:main"

[tool.setuptools.packages.find]
include = ["brownstone*"]

[tool.setuptools.package-data]
brownstone = ["drop_contract.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["work", "data"]

[tool.ruff.lint]
# Errors, pyflakes, import order, bugbear, pyupgrade, simplify, complexity.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90"]

[tool.ruff.lint.mccabe]
# New code stays at or under 10. The one exemption carries `# noqa: C901` and is listed as
# complexity debt in docs/design.md.
max-complexity = 10

[tool.pyright]
# Read by VS Code's Pylance. Setting exclude replaces its defaults, so they are repeated here.
exclude = ["work", "data", "**/node_modules", "**/__pycache__", "**/.*"]

[tool.coverage.run]
source = ["brownstone", "views", "app", "launch"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Floor, not target: CI fails if coverage drops below it. Raise it as coverage improves.
fail_under = 88

[tool.mypy]
python_version = "3.12"  # The tested version; installed stubs (numpy) need 3.12 syntax.
files = ["brownstone", "launch.py"]
ignore_missing_imports = true
warn_unused_ignores = true
