[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brownstone-markets"
version = "0.2.0"
description = "Local TSM market snapshots and opportunity screening"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.2,<2", "polars>=1.20,<2", "pyarrow>=19,<26", "requests>=2.32,<3", "tzdata>=2025.1",
                # DuckDB needs pytz to return TIMESTAMPTZ values to Python.
                "pytz>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "mypy>=1.10,<2"]
dashboard = ["streamlit>=1.40,<2"]

[project.scripts]
brownstone = "brownstone.cli:main"

[tool.setuptools.packages.find]
include = ["brownstone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["work", "data"]

[tool.ruff.lint]
# Errors, pyflakes, import order, bugbear, pyupgrade, simplify.
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"  # The tested version; installed stubs (numpy) need 3.12 syntax.
files = ["brownstone", "launch.py"]
ignore_missing_imports = true
warn_unused_ignores = true
